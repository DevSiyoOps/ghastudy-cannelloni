on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  update_release_draft:
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-22.04
    steps:
      - uses: release-drafter/release-drafter@09c613e259eb8d4e7c81c2cb00618eb5fc4575a7 # v5
        with:
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
